<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>山医小助手 - 山东第一医科大学新生AI答疑平台</title>
  <style>
    :root {
      --blue: #2d3af0;
      --blue-2: #1d2bd8;
      --red: #c0182f;
      --green: #16a34a;
      --amber: #f59e0b;
      --ink: #172033;
      --muted: #6b7280;
      --line: #e6e9f2;
      --soft: #f6f7fb;
      --bubble: #f4f6ff;
      --shadow: 0 18px 45px rgba(25, 36, 82, .12);
      --radius: 18px;
    }

    * { box-sizing: border-box; }

    html {
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Noto Sans SC", "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
      color: var(--ink);
      background: #fff;
      overflow: hidden;
    }

    button, textarea { font: inherit; }
    button { cursor: pointer; }

    .app {
      width: 100%;
      height: 100vh;
      display: flex;
      flex-direction: column;
      background: #fff;
    }

    .topbar {
      flex: 0 0 auto;
      background: var(--blue);
      color: #fff;
      box-shadow: 0 2px 18px rgba(45, 58, 240, .22);
    }

    .topbar-inner {
      width: min(100%, 820px);
      min-height: 64px;
      margin: 0 auto;
      padding: 10px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .back {
      width: 40px;
      height: 40px;
      border: 0;
      border-radius: 12px;
      display: none;
      place-items: center;
      color: #fff;
      background: rgba(255, 255, 255, .12);
      transition-property: transform, background-color;
      transition-duration: 150ms;
      transition-timing-function: ease-out;
    }

    .has-chat .back { display: grid; }
    .back:hover { background: rgba(255, 255, 255, .18); }
    .back:active { transform: scale(.96); }

    .avatar {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      flex: 0 0 auto;
      display: grid;
      place-items: center;
      color: #fff;
      font-weight: 900;
      background:
        radial-gradient(circle at 30% 24%, rgba(255,255,255,.28), transparent 30%),
        linear-gradient(145deg, var(--red), #8f1324);
      border: 2px solid rgba(255, 255, 255, .45);
      box-shadow: 0 8px 18px rgba(0, 0, 0, .18);
    }

    .avatar.user {
      color: var(--blue);
      background: #fff;
      border-color: rgba(45, 58, 240, .12);
      box-shadow: 0 8px 18px rgba(45, 58, 240, .12);
    }

    .title {
      min-width: 0;
      flex: 1;
    }

    .title b {
      display: block;
      font-size: 16px;
      line-height: 1.2;
      letter-spacing: 0;
    }

    .title span {
      display: block;
      margin-top: 3px;
      color: rgba(255, 255, 255, .82);
      font-size: 12px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .clear {
      min-width: 42px;
      min-height: 36px;
      border: 1px solid rgba(255, 255, 255, .24);
      border-radius: 12px;
      color: #fff;
      background: rgba(255, 255, 255, .10);
      font-size: 13px;
      transition-property: transform, background-color;
      transition-duration: 150ms;
      transition-timing-function: ease-out;
    }

    .clear:hover { background: rgba(255, 255, 255, .18); }
    .clear:active { transform: scale(.96); }

    .chat {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      background:
        linear-gradient(180deg, rgba(45, 58, 240, .045), transparent 190px),
        #fff;
    }

    .chat-inner {
      width: min(100%, 820px);
      min-height: 100%;
      margin: 0 auto;
      padding: 24px 16px 28px;
    }

    .home {
      min-height: calc(100vh - 176px);
      display: grid;
      align-content: center;
      justify-items: center;
      gap: 18px;
      text-align: center;
      padding: 28px 0;
    }

    .hero-avatar {
      width: 116px;
      height: 116px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      color: #fff;
      font-size: 44px;
      font-weight: 900;
      background:
        radial-gradient(circle at 34% 26%, rgba(255,255,255,.34), transparent 30%),
        linear-gradient(145deg, var(--red), #851020);
      box-shadow: 0 20px 48px rgba(192, 24, 47, .22);
    }

    .home h1 {
      margin: 4px 0 0;
      font-size: clamp(26px, 5.4vw, 36px);
      line-height: 1.18;
      letter-spacing: 0;
      text-wrap: balance;
    }

    .home p {
      max-width: 620px;
      margin: 0;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.8;
      text-wrap: pretty;
    }

    .badges {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
    }

    .badge {
      min-height: 30px;
      padding: 0 11px;
      border: 1px solid #dfe3f7;
      border-radius: 999px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: #42506a;
      background: #fff;
      font-size: 12px;
      font-weight: 700;
    }

    .badge i {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--green);
    }

    .suggestions {
      width: min(100%, 680px);
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
      margin-top: 8px;
    }

    .suggestion {
      min-height: 56px;
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 12px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      text-align: left;
      color: #243047;
      background: #fff;
      box-shadow: 0 10px 26px rgba(25, 36, 82, .06);
      transition-property: transform, border-color, box-shadow, background-color;
      transition-duration: 160ms;
      transition-timing-function: ease-out;
    }

    .suggestion:hover {
      transform: translateY(-2px);
      border-color: rgba(45, 58, 240, .28);
      background: #fbfcff;
      box-shadow: var(--shadow);
    }

    .suggestion:active { transform: scale(.99); }
    .suggestion span { min-width: 0; font-size: 14px; line-height: 1.45; text-wrap: pretty; }
    .suggestion i { color: var(--blue); font-style: normal; font-weight: 900; }

    .messages {
      display: none;
      padding: 8px 0 4px;
    }

    .has-chat .home { display: none; }
    .has-chat .messages { display: grid; gap: 18px; }

    .message {
      display: grid;
      grid-template-columns: 42px minmax(0, 1fr);
      gap: 12px;
      align-items: start;
      animation: messageIn .24s ease-out both;
    }

    @keyframes messageIn {
      from { opacity: 0; transform: translateY(7px); filter: blur(2px); }
      to { opacity: 1; transform: translateY(0); filter: blur(0); }
    }

    .message.user {
      grid-template-columns: minmax(0, 1fr) 42px;
      justify-items: end;
    }

    .message.user .avatar {
      grid-column: 2;
      grid-row: 1;
    }

    .bubble {
      max-width: 640px;
      border-radius: 18px;
      padding: 13px 15px;
      color: #25304a;
      background: var(--bubble);
      line-height: 1.78;
      font-size: 15px;
      text-align: left;
      text-wrap: pretty;
      box-shadow: 0 8px 24px rgba(36, 48, 80, .06);
    }

    .message.user .bubble {
      grid-column: 1;
      grid-row: 1;
      color: #fff;
      background: var(--blue);
      border-top-right-radius: 6px;
      box-shadow: 0 12px 28px rgba(45, 58, 240, .20);
    }

    .message.ai .bubble {
      border-top-left-radius: 6px;
    }

    .bubble p { margin: 0 0 8px; }
    .bubble p:last-child { margin-bottom: 0; }
    .bubble ul { margin: 8px 0 0; padding-left: 18px; }
    .bubble li { margin: 4px 0; }

    .answer-meta,
    .tag {
      display: none !important;
    }

    .related {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 10px;
    }

    .web-results {
      margin-top: 12px;
      border-top: 1px solid #e1e6f6;
      padding-top: 10px;
      display: grid;
      gap: 8px;
    }

    .web-title {
      color: #42506a;
      font-size: 13px;
      font-weight: 800;
    }

    .search-steps {
      margin-top: 12px;
      border: 1px solid #dfe3f7;
      border-radius: 14px;
      padding: 10px 12px;
      display: grid;
      gap: 8px;
      background: #fff;
    }

    .search-step {
      display: grid;
      grid-template-columns: 20px minmax(0, 1fr);
      gap: 8px;
      align-items: start;
      color: #42506a;
      font-size: 13px;
      line-height: 1.5;
    }

    .search-step i {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      color: #0f6b37;
      background: #dcfce7;
      font-style: normal;
      font-size: 12px;
      font-weight: 900;
    }

    .web-query {
      margin-top: 8px;
      border-radius: 12px;
      padding: 8px 10px;
      color: #42506a;
      background: #f8faff;
      font-size: 13px;
      line-height: 1.55;
      word-break: break-word;
    }

    .web-link {
      min-height: 38px;
      border: 1px solid #dfe3f7;
      border-radius: 12px;
      padding: 8px 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      color: #25304a;
      background: #fff;
      text-decoration: none;
      font-size: 13px;
      line-height: 1.4;
      transition-property: transform, background-color, border-color;
      transition-duration: 150ms;
      transition-timing-function: ease-out;
    }

    .web-link:hover {
      transform: translateY(-1px);
      border-color: rgba(45, 58, 240, .28);
      background: #fbfcff;
    }

    .web-link span:first-child { min-width: 0; text-wrap: pretty; }
    .web-link span:last-child { color: var(--blue); font-weight: 900; }

    .contact-card {
      margin-top: 12px;
      border: 1px solid rgba(45, 58, 240, .16);
      border-radius: 16px;
      padding: 12px;
      display: grid;
      grid-template-columns: 92px minmax(0, 1fr);
      gap: 12px;
      align-items: center;
      background:
        linear-gradient(135deg, rgba(45, 58, 240, .07), rgba(18, 183, 215, .06)),
        #fff;
      box-shadow: 0 12px 30px rgba(25, 36, 82, .07);
    }

    .contact-card img {
      width: 92px;
      height: 92px;
      border-radius: 12px;
      display: block;
      object-fit: cover;
      background: #fff;
      outline: 1px solid rgba(0, 0, 0, .08);
      outline-offset: -1px;
    }

    .contact-card b {
      display: block;
      color: #172033;
      font-size: 14px;
      line-height: 1.35;
    }

    .contact-card span {
      display: block;
      margin-top: 4px;
      color: #6b7280;
      font-size: 12px;
      line-height: 1.5;
      text-wrap: pretty;
    }

    .contact-card small {
      display: inline-flex;
      margin-top: 7px;
      min-height: 24px;
      align-items: center;
      border-radius: 999px;
      padding: 0 8px;
      color: #23357c;
      background: #edf1ff;
      font-size: 12px;
      font-weight: 800;
    }

    .contact-card.image-missing::before {
      content: "二维码暂不可用";
      width: 92px;
      height: 92px;
      border-radius: 12px;
      display: grid;
      place-items: center;
      color: #2d3af0;
      background: #edf1ff;
      font-size: 12px;
      font-weight: 900;
      text-align: center;
    }

    .related button {
      min-height: 32px;
      border: 1px solid #dfe3f7;
      border-radius: 999px;
      padding: 0 10px;
      color: var(--blue);
      background: #fff;
      font-size: 12px;
      font-weight: 700;
      transition-property: transform, background-color, border-color;
      transition-duration: 150ms;
      transition-timing-function: ease-out;
    }

    .related button:hover {
      background: #f6f7ff;
      border-color: rgba(45, 58, 240, .3);
    }

    .related button:active { transform: scale(.97); }

    .typing {
      width: 70px;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .typing i {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #9aa4ba;
      animation: typing 1s infinite ease-in-out;
    }

    .typing i:nth-child(2) { animation-delay: .12s; }
    .typing i:nth-child(3) { animation-delay: .24s; }

    @keyframes typing {
      0%, 80%, 100% { opacity: .35; transform: translateY(0); }
      40% { opacity: 1; transform: translateY(-3px); }
    }

    .composer {
      flex: 0 0 auto;
      border-top: 1px solid var(--line);
      background: rgba(255, 255, 255, .94);
      backdrop-filter: blur(18px);
    }

    .composer-inner {
      width: min(100%, 820px);
      margin: 0 auto;
      padding: 12px 16px 16px;
    }

    .input-box {
      min-height: 56px;
      border: 1px solid #dfe3f7;
      border-radius: 18px;
      display: grid;
      grid-template-columns: minmax(0, 1fr) 46px;
      align-items: end;
      gap: 8px;
      padding: 8px 8px 8px 15px;
      background: #fff;
      box-shadow: 0 12px 34px rgba(25, 36, 82, .08);
    }

    textarea {
      width: 100%;
      min-height: 38px;
      max-height: 120px;
      resize: none;
      border: 0;
      outline: 0;
      padding: 8px 0;
      color: var(--ink);
      background: transparent;
      font-size: 15px;
      line-height: 1.5;
    }

    textarea::placeholder { color: #9aa4ba; }

    .send {
      width: 42px;
      height: 42px;
      border: 0;
      border-radius: 14px;
      display: grid;
      place-items: center;
      color: #fff;
      background: var(--blue);
      box-shadow: 0 10px 22px rgba(45, 58, 240, .22);
      transition-property: transform, background-color, opacity;
      transition-duration: 150ms;
      transition-timing-function: ease-out;
    }

    .send:hover { background: var(--blue-2); }
    .send:active { transform: scale(.96); }
    .send:disabled { cursor: not-allowed; opacity: .55; }

    .helper {
      margin-top: 8px;
      color: #8a93a8;
      font-size: 12px;
      text-align: center;
    }

    @media (max-width: 640px) {
      body { overflow: hidden; }
      .topbar-inner { min-height: 60px; padding: 9px 12px; }
      .clear { display: none; }
      .chat-inner { padding: 18px 12px 22px; }
      .home { min-height: calc(100vh - 164px); }
      .hero-avatar { width: 98px; height: 98px; font-size: 38px; }
      .suggestions { grid-template-columns: 1fr; }
      .message { grid-template-columns: 36px minmax(0, 1fr); gap: 10px; }
      .message.user { grid-template-columns: minmax(0, 1fr) 36px; }
      .avatar { width: 36px; height: 36px; font-size: 13px; }
      .bubble { max-width: 100%; font-size: 14px; }
      .composer-inner { padding: 10px 12px 12px; }
    }

    /* Premium campus chat redesign */
    :root {
      --navy: #101a33;
      --navy-2: #18284a;
      --paper: rgba(255, 255, 255, .86);
      --paper-strong: rgba(255, 255, 255, .96);
      --cyan: #12b7d7;
      --fresh: #effaf7;
      --warm: #fff7e8;
    }

    body {
      background:
        linear-gradient(90deg, rgba(45, 58, 240, .055) 1px, transparent 1px),
        linear-gradient(rgba(45, 58, 240, .045) 1px, transparent 1px),
        linear-gradient(135deg, #f7f9ff 0%, #ffffff 42%, #f2fbff 100%);
      background-size: 36px 36px, 36px 36px, auto;
    }

    .app {
      background:
        linear-gradient(120deg, rgba(192, 24, 47, .08), transparent 30%),
        linear-gradient(240deg, rgba(18, 183, 215, .10), transparent 34%);
      position: relative;
      isolation: isolate;
    }

    .app::before {
      content: "";
      position: fixed;
      inset: 68px 0 0;
      pointer-events: none;
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0), rgba(255, 255, 255, .78) 42%, rgba(255, 255, 255, .92)),
        repeating-linear-gradient(135deg, rgba(16, 26, 51, .035) 0 1px, transparent 1px 18px);
      z-index: -1;
    }

    .topbar {
      background:
        linear-gradient(90deg, var(--navy), var(--blue) 52%, #0a7bc0);
      border-bottom: 1px solid rgba(255, 255, 255, .22);
      box-shadow: 0 18px 48px rgba(25, 36, 82, .18);
    }

    .topbar-inner {
      width: min(100%, 980px);
      min-height: 72px;
      padding: 12px 18px;
      position: relative;
    }

    .topbar-inner::after {
      content: "";
      width: 96px;
      height: 2px;
      position: absolute;
      left: calc(50% - 490px + 18px);
      bottom: 0;
      background: linear-gradient(90deg, var(--red), #fff, var(--cyan));
      opacity: .95;
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex: 0 0 auto;
    }

    .online-pill {
      min-height: 36px;
      border: 1px solid rgba(255, 255, 255, .24);
      border-radius: 999px;
      padding: 0 11px;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      color: rgba(255, 255, 255, .92);
      background: rgba(255, 255, 255, .12);
      font-size: 12px;
      font-weight: 800;
      white-space: nowrap;
    }

    .online-pill i {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #42e49b;
      box-shadow: 0 0 0 4px rgba(66, 228, 155, .14);
    }

    .clear {
      border-color: rgba(255, 255, 255, .28);
      background: rgba(255, 255, 255, .14);
      font-weight: 800;
    }

    .back {
      background: rgba(255, 255, 255, .14);
    }

    .avatar,
    .hero-avatar {
      background:
        linear-gradient(135deg, rgba(255,255,255,.18), transparent 36%),
        linear-gradient(145deg, var(--red), #8a1022);
      box-shadow: 0 12px 28px rgba(192, 24, 47, .24), inset 0 1px 0 rgba(255,255,255,.28);
    }

    .title b {
      font-size: 17px;
    }

    .title span {
      color: rgba(255, 255, 255, .84);
    }

    .chat {
      background: transparent;
    }

    .chat-inner {
      width: min(100%, 980px);
      padding: 28px 18px 30px;
    }

    .home {
      width: min(100%, 820px);
      min-height: calc(100vh - 188px);
      margin: 0 auto;
      align-content: center;
      gap: 16px;
      padding: 34px 18px;
      position: relative;
      isolation: isolate;
    }

    .home::before {
      content: "";
      position: absolute;
      inset: 16px 0;
      border: 1px solid rgba(223, 227, 247, .82);
      border-radius: 28px;
      background:
        linear-gradient(180deg, rgba(255, 255, 255, .78), rgba(255, 255, 255, .62)),
        linear-gradient(135deg, rgba(45, 58, 240, .07), transparent 44%),
        linear-gradient(220deg, rgba(18, 183, 215, .08), transparent 40%);
      box-shadow: 0 28px 80px rgba(25, 36, 82, .12);
      backdrop-filter: blur(18px);
      z-index: -1;
    }

    .hero-avatar {
      width: 108px;
      height: 108px;
      font-size: 42px;
      border: 4px solid rgba(255, 255, 255, .82);
    }

    .home h1 {
      margin-top: 2px;
      color: var(--navy);
      font-size: clamp(30px, 5vw, 42px);
      letter-spacing: 0;
    }

    .home p {
      max-width: 660px;
      color: #526177;
      font-size: 15px;
      line-height: 1.85;
    }

    .badge {
      min-height: 32px;
      border-color: rgba(207, 216, 244, .9);
      background: rgba(255, 255, 255, .82);
      box-shadow: 0 8px 24px rgba(25, 36, 82, .06);
    }

    .campus-strip {
      width: min(100%, 560px);
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
      margin: 2px 0 6px;
    }

    .campus-strip div {
      min-height: 64px;
      border: 1px solid rgba(223, 227, 247, .92);
      border-radius: 16px;
      padding: 10px;
      display: grid;
      place-items: center;
      gap: 2px;
      background: rgba(255, 255, 255, .78);
      box-shadow: 0 12px 30px rgba(25, 36, 82, .07);
    }

    .campus-strip b {
      color: var(--navy);
      font-size: 20px;
      line-height: 1;
      font-variant-numeric: tabular-nums;
    }

    .campus-strip span {
      color: #6b7280;
      font-size: 12px;
      font-weight: 700;
    }

    .media-strip {
      width: min(100%, 720px);
      display: grid;
      grid-template-columns: 1.25fr 1fr 1fr;
      gap: 12px;
      margin: 2px 0 8px;
    }

    .media-tile {
      min-height: 118px;
      border: 1px solid rgba(223, 227, 247, .92);
      border-radius: 20px;
      padding: 0;
      position: relative;
      overflow: hidden;
      background: #e9eefb;
      box-shadow: 0 16px 36px rgba(25, 36, 82, .11);
      transition-property: transform, box-shadow, border-color, filter;
      transition-duration: 180ms;
      transition-timing-function: ease-out;
    }

    .media-tile:hover {
      transform: translateY(-3px);
      border-color: rgba(45, 58, 240, .35);
      box-shadow: 0 24px 50px rgba(25, 36, 82, .16);
      filter: saturate(1.04);
    }

    .media-tile:active {
      transform: scale(.99);
    }

        related: ["宿舍需要准备哪些东西？", "报到需要带什么材料？", "新生兼职有哪些坑？"],

    function buildMediaAnswer(intent) {
      const content = {

      const item = content[intent] || content.overview;
      return {

    }

    function detectDormPrepIntent(query) {
      const q = normalize(query);
      if (!q) return false;
      const dorm = includesAny(q, ["宿舍", "寝室", "公寓", "床铺", "床品", "生活用品", "行李"]);
      const prep = includesAny(q, [
        "准备", "需要准备", "带什么", "买什么", "哪些东西", "什么东西", "清单",
        "必备", "必买", "开学带", "入学带", "行李", "用品"
      ]);
      return dorm && prep;
    }

    function buildDormPrepAnswer() {
      return {
        category: "宿舍准备",
        confidence: 98,
        answer: [
          "宿舍准备可以按“到校当天必须用、到校后再买、谨慎携带”三类来整理。",
          "当天建议带：录取通知书、身份证、档案等重要材料随身放；床上用品、洗漱用品、拖鞋、水杯、纸巾、毛巾、少量衣架、充电器、常用药、创可贴、防晒和雨伞也可以提前准备。",
          "到校后再买更合适：收纳盒、清洁用品、脸盆、水桶、晾衣杆、粘钩、小台灯、洗衣液等，先看宿舍空间和室友分工，别一开始买太多。",
          "谨慎携带：电锅、电热杯、大功率吹风机、劣质插排、床帘支架等，是否允许要看宿舍管理要求。具体楼栋、几人间、床铺尺寸、快递地址，以学院和宿舍通知为准。"

    function detectCampusCardIntent(query) {
      const q = normalize(query);
      if (!q) return false;
      return includesAny(q, ["校园卡", "电话卡", "流量卡", "电信卡", "办卡", "宽带", "套餐"])
        && includesAny(q, ["电信", "移动", "联通", "办", "推荐", "必须", "强制", "套餐", "流量", "宽带", "哪个好", "怎么选"]);
    }

    function buildCampusCardAnswer() {
      return {
        category: "校园卡",
        confidence: 98,
        answer: "校园卡/电话卡可以优先考虑电信，尤其是想同时解决流量、宽带或宿舍网络需求的同学。办理前重点看月租、合约期、流量额度、宽带是否包含、注销是否方便，以及有没有绑定其他业务。遇到“必须办”“不办影响入学”“今天不办就没有优惠”这类说法，先别急着付款。正式缴费、身份认证、校园服务入口以学校公布渠道为准；如果只是想了解哪个套餐实际更稳，可以加学长学姐微信问问真实使用体验。",
        related: ["加学长学姐微信", "宿舍需要准备哪些东西？", "新生兼职有哪些坑？"]
      };
    }

    function handleImageError(img) {
      const holder = img.closest(".gallery-card, .media-tile");
      if (holder) holder.classList.add("image-missing");
      img.style.display = "none";
      img.removeAttribute("src");
    }

    function handleContactImageError(img) {
      const holder = img.closest(".contact-card");
      if (holder) holder.classList.add("image-missing");
      img.style.display = "none";
      img.removeAttribute("src");
    }

    function scoreEntry(query, entry) {
      const q = normalize(query);
      const question = normalize(entry.question);
      let score = 0;

      if (!q) return 0;
      if (question && (q.includes(question) || question.includes(q))) score += 18;

      for (const keyword of entry.keywords) {
        const k = normalize(keyword);
        if (!k) continue;
        if (q === k) score += 18;
        else if (q.includes(k)) score += k.length >= 3 ? 12 : 7;
        else if (k.includes(q) && q.length >= 2) score += 5;
      }

      const category = normalize(entry.category);
      if (category && q.includes(category)) score += 10;

      const hitCount = entry.keywords.filter((keyword) => q.includes(normalize(keyword))).length;
      if (hitCount >= 2) score += 10;
      if (hitCount >= 3) score += 8;

      return score;
    }

    function detectOfficialIntent(query) {
      const q = normalize(query);
      if (!q) return { explicit: false, likely: false };
      const explicit = includesAny(q, ["官网", "官方", "招生网", "教务", "本科招生", "咨询电话", "学校地址", "校区地址"]);
      const likely = includesAny(q, [
        "招生", "录取", "通知书", "电话", "地址", "校区", "在哪", "位置",
        "学费", "住宿费", "缴费", "收费", "绿色通道", "助学贷款",
        "选课", "培养方案", "考试", "绩点", "学分", "综测", "第二课堂"
      ]);
      return { explicit, likely };
    }

    function answerQuestion(query) {
      if (detectContactIntent(query)) return buildContactAnswer();

      const mediaIntent = detectMediaIntent(query);
      if (mediaIntent) return buildMediaAnswer(mediaIntent);

      if (detectDormPrepIntent(query)) return buildDormPrepAnswer();

      if (detectCampusCardIntent(query)) return buildCampusCardAnswer();

      const officialIntent = detectOfficialIntent(query);
      if (officialIntent.explicit) {
        return {
          category: "官网知识",
          confidence: null,
          mode: "local",
          answer: buildOfficialKnowledgeAnswer(query),
          related: ["加学长学姐微信", "报到需要带什么材料？", "学费和住宿费怎么交？"]
        };
      }

      const ranked = knowledgeBase
        .map((entry) => ({ entry, score: scoreEntry(query, entry) }))
        .sort((a, b) => b.score - a.score);
      const best = ranked[0];
      if (!best || best.score < 8) {
        if (officialIntent.likely) {
          return {
            category: "官网知识",
            confidence: null,
            mode: "local",
            answer: buildOfficialKnowledgeAnswer(query),
            related: ["加学长学姐微信", "报到需要带什么材料？", "学费和住宿费怎么交？"]
          };
        }
        return {
          ...fallback
        };
      }
      return {
        category: best.entry.category,
        confidence: Math.min(96, 58 + best.score),
        answer: best.entry.answer,
        related: best.entry.related || fallback.related,
        media: best.entry.media || "",
        contact: Boolean(best.entry.contact)
      };
    }

    function buildOfficialKnowledgeAnswer(query) {
      const q = normalize(query);
      const intro = "我已把山东第一医科大学官网、本科招生信息和教务相关入口能公开确认的基础信息整理进本地知识库。";

        return [

          "报到当天走哪个校门、车辆能不能进校、学院在哪个点位集合，会随年份和现场安排变化，正式出行前看录取通知书、学院通知和迎新安排。"

      }

      if (/招生|录取|通知书|咨询|电话|学院|专业/.test(q)) {
        return [

          "学院、专业、录取通知书、报到批次这类信息每年可能调整，页面回答会先给通用准备建议；涉及具体年份和个人录取结果时，以学校本科招生信息和学院通知为准。"

      }

          "凡是个人二维码、非官方群代缴、先交押金、承诺返现这类情况，都先不要付款。家庭经济有压力，可以关注生源地助学贷款、绿色通道和入学后的困难认定。"
        ].join("\n");
      }

      if (/教务|选课|培养方案|考试|绩点|学分|综测|第二课堂/.test(q)) {
        return [
          "教务类问题一般看本科教育、教务和学院通知。新生最先需要弄清楚培养方案、选课时间、课程考核、学分绩点、考试安排、综测和第二课堂要求。",
          "这些规则会按学院和年级执行，学长学姐经验可以参考，但正式操作以教务系统、学院老师和当年文件为准。"
        ].join("\n");
      }

      if (/宿舍|公寓|床|行李|快递|生活/.test(q)) {
        return [
          "宿舍生活类问题，我会结合公开信息和新生攻略回答：先准备证件材料、床上用品、洗漱用品、拖鞋、水杯、常用药、收纳和少量清洁用品；大功率电器、来路不明插排不要随便带。",
          "具体楼栋、几人间、床铺尺寸、快递收件地址会随校区和学院分配变化，到校前以学院和宿舍管理通知为准；拿不准的生活细节可以扫码问学长学姐。"
        ].join("\n");
      }

      return [

        "目前本地知识库已覆盖学校概况、校区地址、本科招生咨询、报到材料、宿舍生活、缴费避坑、教务学习、校园卡、军训准备和校园图鉴。你可以直接问“报到带什么”“宿舍准备什么”“学费怎么交”“济南校区在哪”“选课绩点怎么回事”。",
        "如果问题特别细，我会优先给可确认的通用结论；拿不准的部分会建议联系学长学姐或等待学院正式通知。"

    function loadHistory() {
      try {
        return JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
      } catch {
        return [];
      }
    }

    function saveHistory() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(messages));
    }

    function escapeHtml(text) {
      return String(text)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;");
    }

    function paragraphize(text) {
      return escapeHtml(text)
        .split("\n")
        .filter(Boolean)
        .map((line) => `<p>${line}</p>`)
        .join("");
    }

    function render() {
      app.classList.toggle("has-chat", messages.length > 0 || isTyping);
      messagesEl.innerHTML = messages.map(renderMessage).join("") + (isTyping ? renderTyping() : "");
      messagesEl.querySelectorAll("[data-related]").forEach((button) => {
        button.addEventListener("click", () => submit(button.dataset.related));
      });
      requestAnimationFrame(() => {
        scroll.scrollTop = messages.length > 0 || isTyping ? scroll.scrollHeight : 0;
      });
    }

    function renderMessage(message) {
      if (message.role === "user") {
        return `
          <article class="message user">
            <div class="bubble">${escapeHtml(message.content)}</div>
            <div class="avatar user">我</div>
          </article>
        `;
      }

      const related = (message.related || [])
        .map((item) => `<button type="button" data-related="${escapeHtml(item)}">${escapeHtml(item)}</button>`)
        .join("");
      const galleryItems = message.media && mediaLibrary[message.media] ? mediaLibrary[message.media] : [];
      const gallery = galleryItems
        .map((item) => `
          <div class="gallery-card" data-fallback-label="${escapeHtml(item.title)}">
            <img src="${escapeHtml(item.src)}" alt="${escapeHtml(item.title)}" loading="lazy" referrerpolicy="no-referrer" onerror="handleImageError(this)" />
            <div>
              <b>${escapeHtml(item.title)}</b>
              <span>${escapeHtml(item.desc)}</span>
            </div>
          </div>
        `)
        .join("");
      const galleryIntro = gallery
        ? `<div class="gallery-intro">图片图鉴<span>${galleryItems.length} 张</span></div>`
        : "";
      const contactCard = message.contact ? `
        <div class="contact-card">
          <img src="${escapeHtml(seniorContact.qr)}" alt="${escapeHtml(seniorContact.title)}" loading="lazy" onerror="handleContactImageError(this)" />
          <div>
            <b>${escapeHtml(seniorContact.title)} · ${escapeHtml(seniorContact.name)}</b>
            <span>${escapeHtml(seniorContact.location)}｜${escapeHtml(seniorContact.desc)}</span>
            <small>扫码添加微信</small>
          </div>
        </div>
      ` : "";
      return `
        <article class="message ai">
          <div class="avatar">山</div>
          <div class="bubble">
            ${paragraphize(message.content)}
            ${contactCard}
            ${galleryIntro}
            ${gallery ? `<div class="gallery-grid">${gallery}</div>` : ""}
            ${related ? `<div class="related">${related}</div>` : ""}
          </div>
        </article>
      `;
    }

    function renderTyping() {
      return `
        <article class="message ai">
          <div class="avatar">山</div>
          <div class="bubble typing"><i></i><i></i><i></i></div>
        </article>
      `;
    }

    function submit(rawText) {
      const text = String(rawText || input.value).trim();
      if (!text || isTyping) return;

      messages.push({ role: "user", content: text });
      input.value = "";
      resizeInput();
      isTyping = true;
      render();

      window.setTimeout(async () => {
        const result = answerQuestion(text);
        messages.push({
          role: "assistant",
          content: result.answer,
          category: result.category,
          confidence: result.confidence,
          mode: result.mode || "local",
          media: result.media || "",
          contact: Boolean(result.contact),
          related: result.related,
          links: []
        });
        isTyping = false;
        saveHistory();
        render();
      }, 560 + Math.random() * 360);
    }

    function resizeInput() {
      input.style.height = "auto";
      input.style.height = Math.min(input.scrollHeight, 120) + "px";
    }

    function resetChat() {
      messages = [];
      isTyping = false;
      localStorage.removeItem(STORAGE_KEY);
      render();
      input.focus();
    }

    quickQuestions.forEach((question) => {
      const button = document.createElement("button");
      button.className = "suggestion";
      button.type = "button";
      button.dataset.icon = question.icon;
      button.innerHTML = `<span>${escapeHtml(question.text)}<small>${escapeHtml(question.desc)}</small></span><i>›</i>`;
      button.addEventListener("click", () => submit(question.text));
      homeSuggestions.appendChild(button);
    });

    function setAgentMode() {
      modeButtons.forEach((button) => {
        button.classList.add("active");
      });
      input.placeholder = "发消息给小医智能体";
    }

    document.querySelectorAll("[data-hero-prompt]").forEach((button) => {
      button.addEventListener("click", () => submit(button.dataset.heroPrompt));
    });

    document.querySelectorAll("[data-gallery-prompt]").forEach((button) => {
      button.addEventListener("click", () => submit(button.dataset.galleryPrompt));
    });

    send.addEventListener("click", () => submit());
    input.addEventListener("input", resizeInput);
    input.addEventListener("keydown", (event) => {
      if (event.key === "Enter" && !event.shiftKey) {
        event.preventDefault();
        submit();
      }
    });
    clear.addEventListener("click", resetChat);
    back.addEventListener("click", resetChat);

    render();
    setAgentMode();
    resizeInput();
  </script>
</body>
